name: Check staged cleanup dependencies
on:
  push:
    branches: [main]
    paths: ['tubes/bridge/check-cleanup.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tubes/bridge/check-cleanup.py
      - uses: actions/upload-artifact@v4
        with:
          name: cleanup-dependencies
          path: dependency-report.json
