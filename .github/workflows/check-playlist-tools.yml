name: Validate shared playlist tools
on:
  push:
    branches: [main]
    paths: ['tubes/shared/modules/PlaylistTools-Standalone.js','modules/PlaylistTools-Standalone.js','.github/workflows/check-playlist-tools.yml','tubes/shared/modules/test-playlist-tools.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check tubes/shared/modules/PlaylistTools-Standalone.js
          node --check modules/PlaylistTools-Standalone.js

      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tubes/shared/modules/test-playlist-tools.mjs
