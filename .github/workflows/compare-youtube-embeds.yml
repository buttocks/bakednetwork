name: Compare documented YouTube embed hosts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tubes/feeds/embed-verify.json'
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        feed: [ddt, nwa-tna, lucha]
        embed: [standard, privacy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tubes/feeds/test-schedule.mjs
      - run: node tubes/feeds/test-browser.mjs
        env:
          BAKED_TEST_FEED: ${{ matrix.feed }}
          BAKED_TEST_EMBED: ${{ matrix.embed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embed-${{ matrix.feed }}-${{ matrix.embed }}
          path: feed-browser-results.json
