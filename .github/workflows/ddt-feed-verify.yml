name: Verify independent DDT feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tubes/DDT/verify.json'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tubes/feeds/test-schedule.mjs
      - run: node tubes/feeds/test-browser.mjs
        env:
          BAKED_TEST_FEED: ddt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-browser-results
          path: feed-browser-results.json
