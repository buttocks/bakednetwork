name: DDT modern Rules-only header
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-ddt-header.yml','tubes/DDT/deploy-header.mjs','tubes/DDT/header.css']
permissions:
  contents: read
concurrency:
  group: baked-ddt-header
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BAKED_LIVE_PASSWORD: ${{ secrets.BAKED_LIVE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tubes/DDT/deploy-header.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node tubes/DDT/deploy-header.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ddt-header-review
          path: ddt-header-review/
          retention-days: 30
