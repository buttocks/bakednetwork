name: Compact Dragon Gate headers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-dragongate-header.yml','tubes/DragonGate/header.css','tubes/DragonGate/deploy-header.mjs']
permissions:
  contents: read
concurrency:
  group: baked-dragongate-header-rollout
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tube: [DG, DGalt]
    env:
      TUBE: ${{ matrix.tube }}
      BAKED_LIVE_PASSWORD: ${{ secrets.BAKED_LIVE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tubes/DragonGate/deploy-header.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node tubes/DragonGate/deploy-header.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dragongate-header-${{ matrix.tube }}
          path: dragongate-header-review/
          retention-days: 30
