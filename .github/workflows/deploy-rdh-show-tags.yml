name: Repair RDH show tags
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baked-skin-review
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BAKED_LIVE_PASSWORD: ${{ secrets.BAKED_LIVE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tubes/RDH/deploy-show-tags.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node tubes/RDH/deploy-show-tags.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rdh-show-tags-review
          path: rdh-show-tags-review/
          retention-days: 30
