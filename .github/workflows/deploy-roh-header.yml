name: Deploy compact ROH ringside header
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-roh-header.yml','tubes/ROH/header.css','tubes/ROH/deploy-header.mjs']
permissions:
  contents: read
concurrency:
  group: baked-skin-review
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BAKED_LIVE_PASSWORD: ${{ secrets.BAKED_LIVE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tubes/ROH/deploy-header.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node tubes/ROH/deploy-header.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roh-ringside-header
          path: roh-header-review/
          retention-days: 30
