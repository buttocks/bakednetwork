name: Deploy and verify ROH branded skin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-roh-skin.yml'
      - 'tubes/ROH/skin.css'
      - 'tubes/ROH/deploy-skin.mjs'
permissions:
  contents: read
concurrency:
  group: baked-skin-review
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BAKED_LIVE_PASSWORD: ${{ secrets.BAKED_LIVE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tubes/ROH/deploy-skin.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node tubes/ROH/deploy-skin.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roh-skin-before-after
          path: roh-skin-review/
          retention-days: 30
