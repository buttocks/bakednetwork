name: Deploy restored main WrestleTube ringside theme
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-wrestletube-ringside.yml','tubes/WrestleTube/ringside-restoration.css','tubes/WrestleTube/deploy-ringside.mjs','tubes/WrestleTube/ringside-motd.html']
permissions:
  contents: read
concurrency:
  group: baked-skin-review
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BAKED_LIVE_PASSWORD: ${{ secrets.BAKED_LIVE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tubes/WrestleTube/deploy-ringside.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node tubes/WrestleTube/deploy-ringside.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrestletube-ringside
          path: wrestletube-ringside-review/
          retention-days: 30
