name: Diagnose DGALT playlist permissions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-dgalt-permissions.yml']
permissions:
  contents: read
concurrency:
  group: baked-live-iframe-bridge
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BAKED_LIVE_PASSWORD: ${{ secrets.BAKED_LIVE_PASSWORD }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Read DGALT permission thresholds without changing settings
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({channel:'chrome',headless:true});
          try{
            const page=await browser.newPage();
            await page.goto('https://baked.live/login',{waitUntil:'domcontentloaded'});
            const form=page.locator('form[action="/login"]').last();
            await form.locator('input[name="name"]').fill('buttman-gpt');
            await form.locator('input[name="password"]').fill(process.env.BAKED_LIVE_PASSWORD);
            await form.locator('button[type="submit"]').click();
            await page.waitForLoadState('domcontentloaded');
            await page.goto('https://baked.live/tv/DGALT',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.socket?.connected&&window.CLIENT?.logged_in&&window.CLIENT?.name?.toLowerCase()==='buttman-gpt'&&window.CHANNEL?.name?.toLowerCase()==='dgalt'&&Number.isFinite(window.CLIENT?.rank)&&window.CLIENT.rank>=3,{},{timeout:45000});
            await page.waitForTimeout(3500);
            const result=await page.evaluate(()=>{
              const keys=['playlistadd','playlistaddcustom','addnontemp'];
              return {channel:window.CHANNEL.name,rank:window.CLIENT.rank,connected:window.socket.connected,
                permissions:Object.fromEntries(keys.map(k=>[k,{allowed:!!window.hasPermission?.(k),threshold:window.CHANNEL?.perms?.[k]??window.CHANNEL?.permissions?.[k]??null}])),
                permissionFunction:String(window.hasPermission).slice(0,1200),
                relevantControls:[...document.querySelectorAll('input,select')].filter(e=>keys.some(k=>e.id.includes(k)||e.name.includes(k))).map(e=>({id:e.id,name:e.name,value:e.value,disabled:e.disabled})),
                queueContainsFeed:[...document.querySelectorAll('#queue .queue_entry')].some(e=>e.textContent.includes('BAKED TV — DRAGON GATE ALT'))};
            });
            console.log('DGALT_PERMISSION_DIAGNOSTIC '+JSON.stringify(result));
            assert.equal(result.channel.toLowerCase(),'dgalt');
          }finally{await browser.close()}
          JS
