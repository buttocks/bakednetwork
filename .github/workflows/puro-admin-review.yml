name: Review Puro authenticated channel state
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/puro-admin-review.yml','tubes/Puro/review-admin.mjs']
permissions:
  contents: read
concurrency:
  group: baked-skin-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BAKED_LIVE_PASSWORD: ${{ secrets.BAKED_LIVE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tubes/Puro/review-admin.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node tubes/Puro/review-admin.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puro-admin-review
          path: puro-admin-review/
          retention-days: 30
