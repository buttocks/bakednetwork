name: Audit RDH active chat effects
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/rdh-effects-audit.yml','tubes/RDH/audit-chat-effects.mjs']
permissions:
  contents: read
concurrency:
  group: baked-skin-review
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BAKED_LIVE_PASSWORD: ${{ secrets.BAKED_LIVE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tubes/RDH/audit-chat-effects.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node tubes/RDH/audit-chat-effects.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rdh-effects-audit-review
          path: rdh-effects-audit-review/
          retention-days: 30
