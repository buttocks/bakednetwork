name: Simplify RDH newsletter rule label
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/rdh-motd-newsletter-label.yml','tubes/RDH/simplify-newsletter-rule.mjs']
permissions:
  contents: read
concurrency:
  group: baked-skin-review
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BAKED_LIVE_PASSWORD: ${{ secrets.BAKED_LIVE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tubes/RDH/simplify-newsletter-rule.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node tubes/RDH/simplify-newsletter-rule.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rdh-motd-newsletter-label-review
          path: rdh-motd-newsletter-label-review/
          retention-days: 30
