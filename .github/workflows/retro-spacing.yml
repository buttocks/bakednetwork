name: RetroWrestling header spacing correction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/retro-spacing.yml','tubes/RetroWrestling/fix-spacing.mjs']
permissions:
  contents: read
concurrency:
  group: baked-skin-review
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BAKED_LIVE_PASSWORD: ${{ secrets.BAKED_LIVE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tubes/RetroWrestling/fix-spacing.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node tubes/RetroWrestling/fix-spacing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retro-spacing-review
          path: retro-spacing-review/
          retention-days: 30
