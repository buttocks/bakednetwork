name: Upgrade minimal tube skins and identify Puro artwork
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollout-minimal-skins.yml'
permissions:
  contents: read
concurrency:
  group: baked-skin-review
  cancel-in-progress: false
jobs:
  rollout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        batch: [0, 1, 2, 3, 4, 5]
    env:
      BATCH: ${{ matrix.batch }}
      BAKED_LIVE_PASSWORD: ${{ secrets.BAKED_LIVE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tubes/skin-review/rollout-minimal.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node tubes/skin-review/rollout-minimal.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-skin-rollout-${{ matrix.batch }}
          path: skin-rollout/
          retention-days: 30
