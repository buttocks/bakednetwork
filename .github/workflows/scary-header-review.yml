name: Review ScaryTube visible header
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/scary-header-review.yml','tubes/ScaryTube/review-header.mjs']
permissions:
  contents: read
concurrency:
  group: baked-skin-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tubes/ScaryTube/review-header.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node tubes/ScaryTube/review-header.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scary-header-review
          path: scary-header-review/
          retention-days: 14
