name: Bootstrap shoot-style wrestling feeds
on:
  push:
    branches: [main]
    paths: ['tubes/feeds/shoot-bootstrap.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: baked-shoot-bootstrap
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate official programming
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: python tubes/feeds/bootstrap-shoot.py
      - name: Save successful catalogs
        run: |
          git config user.name 'Baked TV Discovery Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add tubes/Shoot
          if git diff --cached --quiet; then echo 'No new validated catalogs'; else
            git commit -m 'Seed shoot-style wrestling feed catalogs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
