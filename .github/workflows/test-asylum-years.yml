name: Verify NWA-TNA Asylum Years
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-asylum-years.yml'
permissions:
  contents: read
concurrency:
  group: asylum-years-playback
  cancel-in-progress: false
jobs:
  playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BAKED_TEST_FEED: nwa-tna-early
      BAKED_TEST_EMBED: standard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for published Asylum Years catalog
        run: |
          node --input-type=module <<'JS'
          let ready=false;
          for(let i=0;i<30;i++){
            try {
              const res=await fetch('https://buttocks.github.io/bakednetwork/tubes/NWA-TNA/programs.json?verify='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(10000)});
              const data=await res.json();
              const p=data.channels?.['nwa-tna-early']?.programs;
              if(res.ok&&Array.isArray(p)&&p.length>=17&&p.filter(x=>x.source==='Internet Archive').length>=12){
                console.log('Published catalog ready:',p.length);ready=true;break;
              }
            }catch(e){console.log('Catalog not ready:',e.message);}
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!ready)throw Error('Published catalog not ready; no playback claim');
          JS
      - name: Diagnose public archive source availability
        run: |
          node --input-type=module <<'JS'
          const res=await fetch('https://buttocks.github.io/bakednetwork/tubes/NWA-TNA/programs.json',{cache:'no-store'});
          const data=await res.json();
          const items=data.channels['nwa-tna-early'].programs.filter(p=>p.source==='Internet Archive');
          const groups=new Map();
          for(const p of items){
            const id=new URL(p.url).pathname.split('/')[2];
            if(!groups.has(id))groups.set(id,[]);
            groups.get(id).push(p);
          }
          for(const [id,programs] of groups){
            for(const p of [programs[0],programs.at(-1)].filter((v,i,a)=>a.indexOf(v)===i)){
              try{
                const response=await fetch(p.url,{headers:{Range:'bytes=0-1023'},redirect:'follow',signal:AbortSignal.timeout(15000)});
                console.log(JSON.stringify({archive:id,title:p.title,status:response.status,type:response.headers.get('content-type'),range:response.headers.get('content-range')}));
                await response.body?.cancel();
              }catch(e){console.log(JSON.stringify({archive:id,title:p.title,error:e.message}));}
            }
          }
          JS
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Compare native video playback and browser codec support
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const catalog=await (await fetch('https://buttocks.github.io/bakednetwork/tubes/NWA-TNA/programs.json?probe='+Date.now())).json();
          const archive=catalog.channels['nwa-tna-early'].programs.filter(p=>p.source==='Internet Archive');
          const samples=[archive[0],archive.find(p=>p.title.includes('PPV #27'))].filter(Boolean);
          for(const engine of ['chromium','chrome']){
            let browser;
            try{
              browser=await chromium.launch({...(engine==='chrome'?{channel:'chrome'}:{}),headless:true,args:['--autoplay-policy=no-user-gesture-required']});
              const page=await browser.newPage();
              await page.goto('https://buttocks.github.io/bakednetwork/tubes/NWA-TNA/feed.html?channel=nwa-tna-early&embed=standard');
              await page.route('**/programs.json*',route=>route.abort());
              const codec=await page.evaluate(()=>{const v=document.createElement('video');return {h264:v.canPlayType('video/mp4; codecs="avc1.64001f, mp4a.40.2"'),hevc:v.canPlayType('video/mp4; codecs="hvc1.1.6.L93.B0"'),vp9:v.canPlayType('video/webm; codecs="vp9, opus"')}});
              console.log('MEDIA_CODEC '+JSON.stringify({engine,codec}));
              for(const p of samples){
                const response=[];
                const failed=[];
                const onResponse=r=>{if(r.request().resourceType()==='media')response.push({status:r.status(),type:r.headers()['content-type']})};
                const onFailed=r=>{if(r.resourceType()==='media')failed.push(r.failure()?.errorText)};
                page.on('response',onResponse);page.on('requestfailed',onFailed);
                const result=await page.evaluate(async src=>{
                  const v=document.createElement('video');v.muted=true;v.preload='auto';v.playsInline=true;document.body.append(v);
                  const result=await new Promise(resolve=>{
                    let done=false;const finish=event=>{if(done)return;done=true;clearTimeout(timer);resolve({event,error:v.error?{code:v.error.code,message:v.error.message}:null,readyState:v.readyState,networkState:v.networkState,duration:Number.isFinite(v.duration)?v.duration:null,width:v.videoWidth,height:v.videoHeight,currentTime:v.currentTime});};
                    const timer=setTimeout(()=>finish('timeout'),18000);
                    v.addEventListener('error',()=>finish('error'),{once:true});
                    v.addEventListener('playing',()=>finish('playing'),{once:true});
                    v.src=src;v.play().catch(e=>{if(v.error)finish(e.name);});
                  });
                  v.pause();v.removeAttribute('src');v.load();v.remove();return result;
                },p.url);
                console.log('MEDIA_PROBE '+JSON.stringify({engine,title:p.title,...result,response,failed}));
                page.off('response',onResponse);page.off('requestfailed',onFailed);
              }
            }catch(e){console.log('MEDIA_PROBE_ENGINE '+JSON.stringify({engine,error:String(e.message).slice(0,400)}))}
            finally{await browser?.close()}
          }
          JS
      - run: node tubes/feeds/test-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asylum-years-playback-result
          path: feed-browser-results.json
          retention-days: 30
