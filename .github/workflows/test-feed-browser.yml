name: Test Baked TV browser playback
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tubes/feeds/test-browser.mjs'
      - '.github/workflows/test-feed-browser.yml'
      - 'tubes/NWA-TNA/feed.html'
      - 'tubes/DDT/feed.html'
      - 'tubes/DDT/programs.json'
      - 'tubes/feeds/discovery.json'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      feeds: ${{ steps.matrix.outputs.feeds }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: node -e 'const c=require("./tubes/feeds/discovery.json"); console.log("feeds="+JSON.stringify(c.channels.map(e=>e.key)))' >> "$GITHUB_OUTPUT"
  browser:
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        feed: ${{ fromJSON(needs.discover.outputs.feeds) }}
    env:
      BAKED_TEST_FEED: ${{ matrix.feed }}
      BAKED_TEST_EMBED: standard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tubes/feeds/test-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-browser-results-${{ matrix.feed }}
          path: feed-browser-results.json
