name: Verify targeted ROH match candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/test-roh-targeted.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        feed: [roh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Discover public embeddable programming and verify decoded frames
        env:
          FEED: ${{ matrix.feed }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const feed=process.env.FEED;
          const config={
            roh:{queries:['Ring of Honor full match','ROH wrestling classic match','Ring of Honor 2005 wrestling match','Ring of Honor 2010 wrestling match','ROH wrestling full event'],match:/ring[ -]+of[ -]+honor|\bROH\b/i},
            'nwa-tna-early':{queries:['NWA TNA PPV 2002 full match','NWA TNA PPV 2003 full match','NWA TNA PPV 2004 full match'],match:/\bNWA[ /-]*TNA\b|\bTNA\b/i},
            dg:{queries:['Dragon Gate wrestling 2024 match','Dragon Gate wrestling 2025 match','Dragon Gate wrestling 2018 match'],match:/dragon[ -]?gate|dragongate|toryumon/i},
            dgalt:{queries:['Toryumon Japan 2001 match','Dragon Gate wrestling 2005 match','Dragon Gate wrestling 2009 match'],match:/dragon[ -]?gate|dragongate|toryumon/i},
            noah:{queries:['NOAH GHC tag team match','NOAH Kenta Kobashi match','NOAH Global League wrestling'],match:/\bNOAH\b|\bGHC\b|プロレスリング・ノア/i},
            indies:{queries:['CHIKARA full match','DEFY Wrestling full match','Ring of Honor full match','PWG wrestling full match'],match:/beyond wrestling|chikara|defy wrestling|\bGCW\b|game changer wrestling|ring of honor|\bROH\b|\bPWG\b|pro wrestling guerrilla/i},
            rizin:{queries:['RIZIN full fight 2023','RIZIN full fight 2024','RIZIN Grand Prix fight','RIZIN Landmark full fight'],match:/\bRIZIN\b/i},
            wid:{queries:['TNA wrestling full match','Lucha Libre AAA full match','WCW classic full match','CMLL lucha libre match'],match:/\bNJPW\b|\bTNA\b|\bWCW\b|lucha libre|\bAAA\b|\bCMLL\b/i}
          }[feed];
          const dirs={roh:'ROH','nwa-tna-early':'NWA-TNA',dg:'DragonGate',dgalt:'DragonGate/secondary/DGalt',noah:'NOAH',indies:'Indies',rizin:'Rizin',wid:'WID'};
          const existing=new Set();
          for(const key of (feed==='dg'||feed==='dgalt'?['dg','dgalt']:[feed])){
            const c=JSON.parse(fs.readFileSync('tubes/'+dirs[key]+'/programs.json')).channels[key];
            for(const p of c.programs)if(p.dailymotion_id)existing.add(p.dailymotion_id);
          }
          const candidates=new Map(),results=[];
          for(const query of config.queries){
            try{
              const params=new URLSearchParams({search:query,fields:'id,title,duration,allow_embed,owner.screenname,description',limit:'40'});
              const response=await fetch('https://api.dailymotion.com/videos?'+params,{signal:AbortSignal.timeout(15000)});
              const data=await response.json();
              console.log('DM_SEARCH '+JSON.stringify({feed,query,status:response.status,count:data.list?.length||0}));
              for(const v of data.list||[]){
                if(!/^[A-Za-z0-9]{2,30}$/.test(v.id||'')||v.allow_embed!==true||!Number.isFinite(v.duration)||v.duration<300||v.duration>14400||!config.match.test(v.title||''))continue;
                if(existing.has(v.id))continue;
                if(feed==='nwa-tna-early'&&!/\b200[234]\b|\b0[234]\b|\basylum\b/i.test(v.title))continue;
                if(feed==='dgalt'&&!/\b(?:199[89]|200[0-9]|201[0-2])\b|toryumon/i.test(v.title))continue;
                if(feed==='dg'&&/\b(?:199[89]|200[0-9]|201[0-2])\b|toryumon/i.test(v.title))continue;
                if(/announc|press conference|interview|official for|news report|highlights|trailer|preview|reaction|watchalong|watch along|gameplay|simulation|WWE 2K|fantasy booking|digest|ダイジェスト|予告|結果速報/i.test(v.title))continue;
                if(!/\bvs\.?\s|\bv\.\s|\bmatch\b|\bfight\b|\bshow\b|\bevent\b|\bchampionship\b|\btitle\b|\bPPV\b|対|試合/i.test(v.title))continue;
                candidates.set(v.id,{id:v.id,title:v.title,duration:v.duration,owner:v['owner.screenname']||'',query});
              }
            }catch(e){console.log('DM_SEARCH_ERROR '+JSON.stringify({feed,query,error:e.message}));}
          }
          // Limit each pilot to 18 distinct candidates; prefer apparent publisher uploads.
          // Explicit public match pages found during manual review; verify provider metadata first.
          for(const id of ['xbzjlkm','xahymzm','x9htr7s','x9i1294','x9i1wky','xbzjge6','xbzjgvi','x94py1u','x9i12dw']){
            try{
              const r=await fetch('https://api.dailymotion.com/video/'+id+'?fields=id,title,duration,allow_embed,owner.screenname',{signal:AbortSignal.timeout(15000)});
              const v=await r.json();
              if(r.ok&&v.id===id&&v.allow_embed===true&&Number.isFinite(v.duration)&&v.duration>=300&&v.duration<=14400)candidates.set(id,{id,title:v.title,duration:v.duration,owner:v['owner.screenname']||'',query:'reviewed match'});
            }catch{}
          }
          const ranked=[...candidates.values()].filter(v=>v.query==='reviewed match').sort((a,b)=>Number(config.match.test(b.owner))-Number(config.match.test(a.owner)));
          const chosen=[];
          const groups=[ranked.slice()];
          while(chosen.length<30&&groups.some(g=>g.length)){
            for(const g of groups)if(g.length&&chosen.length<30)chosen.push(g.shift());
          }
          for(const v of chosen)console.log('DM_CANDIDATE '+JSON.stringify({feed,...v}));
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--autoplay-policy=no-user-gesture-required']});
          fs.mkdirSync('dm-expansion',{recursive:true});
          async function test(p){
            const page=await browser.newPage({viewport:{width:1024,height:576}});
            let verified=null;const samples=new Map();
            try{
              const origin='https://buttocks.github.io/bakednetwork/tubes/dm-expansion-probe.html';
              const url='https://geo.dailymotion.com/player/x8lr5.html?video='+p.id+'&autoplay=true&startTime=20';
              await page.route(origin,r=>r.fulfill({contentType:'text/html',body:'<!doctype html><body style="margin:0"><iframe allow="autoplay; fullscreen; picture-in-picture" style="border:0;width:100vw;height:100vh" src="'+url+'"></iframe></body>'}));
              await page.goto(origin,{waitUntil:'domcontentloaded',timeout:20000});
              const until=Date.now()+35000;
              while(Date.now()<until&&!verified){
                for(const f of page.frames().filter(f=>f.url().startsWith('https://geo.dailymotion.com/player/'))){
                  try{
                    const vs=await f.evaluate(()=>[...document.querySelectorAll('video')].map(v=>({time:v.currentTime,duration:v.duration,width:v.videoWidth,height:v.videoHeight,paused:v.paused})));
                    for(const [i,v] of vs.entries()){
                      if(!v.width||!v.height||v.paused||!Number.isFinite(v.duration)||Math.abs(v.duration-p.duration)>Math.max(5,p.duration*.03))continue;
                      if(!samples.has(i))samples.set(i,v.time);
                      else if(v.time>samples.get(i)+1){verified=v;break}
                    }
                  }catch{}
                }
                if(!verified)await page.waitForTimeout(750);
              }
              if(verified)await page.screenshot({path:'dm-expansion/'+p.id+'.png'});
              return {...p,verified:!!verified,video:verified};
            }catch(e){return {...p,verified:false,error:e.message};}
            finally{await page.close();}
          }
          try{
            for(let i=0;i<chosen.length;i+=3){
              const batch=await Promise.all(chosen.slice(i,i+3).map(test));
              for(const result of batch){results.push(result);console.log('DM_EXPANSION '+JSON.stringify({feed,...result}));}
            }
          }finally{await browser.close()}
          fs.writeFileSync('dm-expansion/results.json',JSON.stringify({feed,candidates:ranked,results},null,2));
          console.log('ROH_TARGETED_SUMMARY '+JSON.stringify({feed,discovered:ranked.length,tested:results.length,verified:results.filter(p=>p.verified).length}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roh-dailymotion-verified
          path: dm-expansion/
          retention-days: 30
