name: Refresh Baked TV catalogs (Archive + official YouTube)

on:
  schedule:
    - cron: '17 4,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tubes/feeds/discovery.json'
      - 'tubes/feeds/discover.py'
      - 'tubes/feeds/test-schedule.mjs'
      - '.github/workflows/update-lucha-catalog.yml'

permissions:
  contents: write

concurrency:
  group: baked-tv-program-discovery
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YouTube metadata discovery
        run: python -m pip install --disable-pip-version-check 'yt-dlp>=2026.9.1'
      - name: Validate and discover a few programs per feed
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          set -e
          python -m py_compile tubes/feeds/discover.py
          node --check tubes/feeds/player-core.js
          node tubes/feeds/test-schedule.mjs
          python tubes/feeds/test-multipart-retention.py
          python tubes/feeds/discover.py
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'tubes/feeds')
          from discover import retain_catalog, approved_url
          c=json.load(open('tubes/feeds/discovery.json'))
          for ch in c['channels']:
              cap=ch.get('max_catalog_items',c['defaults']['max_catalog_items'])
              path=Path('tubes')/ch['directory']/'programs.json'
              programs=json.loads(path.read_text())['channels'][ch['key']]['programs']
              protected_count=len(retain_catalog(programs,ch.get('seed_count',0),0))
              assert len(programs) <= max(cap,protected_count), f'{path} {ch["key"]} exceeds {cap} (protected {protected_count})'
              assert len({p['url'] for p in programs}) == len(programs)
              assert all(p['source'] in ('YouTube', 'Internet Archive', 'Dailymotion') and approved_url(p['url']) for p in programs), f'{path} invalid source or URL'
              assert all(isinstance(p.get('playback_verified_run'),int) and p['playback_verified_run']>0 and p['url']=='https://www.dailymotion.com/video/'+p.get('dailymotion_id','') for p in programs if p['source']=='Dailymotion'), f'{path} unverified Dailymotion entry'
              assert all(p['duration']>=60 for p in programs)
              print(path, ch['key'],len(programs),'programs; limit',cap)
          PY
      - name: Save bounded catalog changes if any
        run: |
          git config user.name 'Baked TV Discovery Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'tubes/*/programs.json' tubes/feeds/discovery-state.json
          if git diff --cached --quiet; then
            echo 'No catalog or discovery-state updates'
          else
            git commit -m 'Refresh bounded Baked TV program catalogs'
            # A concurrent operator edit can touch the same catalog. Preserve it
            # and let the next scheduled scan retry rather than force-overwrite.
            if ! git pull --rebase origin main; then
              echo 'Concurrent edits: preserving remote catalog; next scheduled scan will retry.'
              git rebase --abort || true
              exit 0
            fi
            git push origin HEAD:main
          fi
