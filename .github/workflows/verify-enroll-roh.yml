name: Verify and enroll ROH stream
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-enroll-roh.yml']
permissions:
  contents: write
concurrency:
  group: baked-live-iframe-bridge
  cancel-in-progress: false
jobs:
  enroll:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BAKED_LIVE_PASSWORD: ${{ secrets.BAKED_LIVE_PASSWORD }}
      BAKED_TEST_FEED: roh
      BAKED_TEST_EMBED: standard
      BAKED_TEST_BROWSER: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify deployed catalog
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL --max-time 15 https://buttocks.github.io/bakednetwork/tubes/ROH/programs.json | node -e 'let b="";process.stdin.on("data",c=>b+=c);process.stdin.on("end",()=>{try{if(JSON.parse(b).channels.roh.programs.length<3)process.exitCode=1}catch{process.exitCode=1}})'; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Confirm actual ROH feed playback
        run: node tubes/feeds/test-browser.mjs
      - name: Add permanent feed only after playback proof
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const proof=JSON.parse(fs.readFileSync('feed-browser-results.json')).find(x=>x.feed==='roh');
          assert.ok(proof?.playing&&!proof.errors.length&&proof.guide>0);
          const registry=JSON.parse(fs.readFileSync('tubes/channels.json'));
          const ch=registry.channels.find(x=>x.slug.toLowerCase()==='roh'&&x.adminVerified);
          assert.ok(ch);
          const url='https://buttocks.github.io/bakednetwork/tubes/ROH/feed.html?channel=roh&embed=standard';
          const title='BAKED TV — RING OF HONOR';
          const b=await chromium.launch({channel:'chrome',headless:true});
          try{
            const p=await b.newPage();
            await p.goto('https://baked.live/login',{waitUntil:'domcontentloaded',timeout:45000});
            const f=p.locator('form[action="/login"]').last();
            await f.locator('input[name="name"]').fill('buttman-gpt');
            await f.locator('input[name="password"]').fill(process.env.BAKED_LIVE_PASSWORD);
            await f.locator('button[type="submit"]').click();
            await p.waitForLoadState('domcontentloaded');
            await p.goto('https://baked.live/tv/'+ch.slug,{waitUntil:'domcontentloaded',timeout:45000});
            const snapshot=()=>p.evaluate(()=>({
              channel:window.CHANNEL?.name,rank:window.CLIENT?.rank,loggedIn:!!window.CLIENT?.logged_in,connected:!!window.socket?.connected,user:window.CLIENT?.name,
              allowed:['playlistadd','playlistaddcustom','addnontemp'].every(k=>typeof window.hasPermission==='function'&&window.hasPermission(k)),
              queue:[...document.querySelectorAll('#queue .queue_entry')].map(el=>{const j=window.jQuery(el),m=j.data('media')||{};const t=document.createElement('textarea');t.innerHTML=m.meta?.embed?.src||'';return {uid:j.data('uid'),type:m.type,src:t.value,temp:!!j.data('temp')}})
            }));
            const valid=s=>s.loggedIn&&s.connected&&s.rank>=3&&s.user?.toLowerCase()==='buttman-gpt'&&s.channel?.toLowerCase()==='roh'&&s.allowed;
            let s;
            for(let i=0;i<120;i++){s=await snapshot();if(valid(s))break;await p.waitForTimeout(500)}
            assert.ok(valid(s),'ROH authorization not verified');
            await p.waitForTimeout(2500);
            s=await snapshot();assert.ok(valid(s));
            const matches=s.queue.filter(x=>x.type==='cu'&&x.src===url);
            assert.ok(matches.length<=1,'Ambiguous existing copies');
            if(matches.length===0){
              await p.evaluate(({url,title})=>{
                if(!window.socket?.connected||!window.CLIENT?.logged_in||window.CLIENT?.name?.toLowerCase()!=='buttman-gpt'||window.CLIENT?.rank<3||window.CHANNEL?.name?.toLowerCase()!=='roh'||!['playlistadd','playlistaddcustom','addnontemp'].every(k=>window.hasPermission(k)))throw Error('Authorization changed');
                window.socket.emit('queue',{id:'<iframe src="'+url+'" width="1280" height="720" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>',title,type:'cu',pos:'end',temp:false});
              },{url,title});
            }
            let after;
            for(let i=0;i<80;i++){after=await snapshot();if(after.queue.some(x=>x.src===url&&!x.temp))break;await p.waitForTimeout(250)}
            assert.ok(valid(after)&&after.queue.filter(x=>x.src===url&&!x.temp).length===1,'Permanent enrollment not confirmed');
            console.log('ROH_ENROLLED '+JSON.stringify({channel:ch.slug,permanent:true,queueBefore:s.queue.length,queueAfter:after.queue.length,playbackVerified:true}));
            const cfg=JSON.parse(fs.readFileSync('tubes/feeds/managed.json'));
            if(!cfg.managed.some(x=>x.id==='roh-baked-tv'))cfg.managed.push({tube:ch.slug,id:'roh-baked-tv',title,url,banner:'ROH',statusFile:'tubes/ROH/feed-status.json',statusKey:'roh',addOnly:true});
            fs.writeFileSync('tubes/feeds/managed.json',JSON.stringify(cfg,null,2)+'\n');
            fs.writeFileSync('tubes/ROH/feed-status.json',JSON.stringify({schema:1,channels:{roh:{available:true,verification:'hosted browser playback and permanent queue enrollment',verifiedRun:Number(process.env.GITHUB_RUN_ID)}}},null,2)+'\n');
          }finally{await b.close()}
          JS
      - name: Register confirmed stream for automatic reconciliation
        run: |
          node tubes/feeds/manage.mjs --self-test
          git config user.name 'Baked TV Feed Monitor'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add tubes/feeds/managed.json tubes/ROH/feed-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Enroll verified ROH feed permanently and enable automatic reconciliation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roh-playback-verification
          path: feed-browser-results.json
          retention-days: 7
