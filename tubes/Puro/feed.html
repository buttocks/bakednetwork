<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>PURORESU — Baked TV</title>
<style>
:root{font:14px system-ui,-apple-system,Segoe UI,sans-serif;color:#f8e8cb;background:#050505}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
video{position:absolute;inset:0;z-index:0;width:100%;height:100%;background:#000;object-fit:contain}
#youtube-shell{position:absolute;z-index:0;inset:0;background:#000}
#youtube-shell[hidden]{display:none!important}
#youtube-frame,#youtube-shell iframe{display:block;width:100%;height:100%;border:0}
#status{z-index:1}

header{position:absolute;z-index:3;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;gap:9px;pointer-events:none}
.controls{display:flex;gap:7px;pointer-events:auto}
button{font:700 12px system-ui;cursor:pointer;border:1px solid #d2ab53;color:#ffe3a4;background:#241411ec;padding:8px 10px;border-radius:5px}
button:hover,button:focus-visible{background:#57231d}
#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:12px;padding:18px;background:linear-gradient(115deg,#071912,#1b1610 52%,#2c0e10);color:#f4d9a6}
#status[hidden]{display:none}
#status strong{font:900 clamp(24px,5vw,46px)/1.1 Impact,"Arial Black",system-ui;letter-spacing:.06em}
#status .accent{color:#df6464}#status small{max-width:670px;line-height:1.5;color:#d6bfa7}
#now{position:absolute;z-index:2;bottom:0;left:0;right:0;padding:16px 18px 12px;background:linear-gradient(transparent,#050304df 60%,#050304ee);pointer-events:none;transition:opacity .8s ease,visibility 0s linear .8s}
header{transition:opacity .8s ease,visibility 0s linear .8s}
body.overlay-idle #now,body.overlay-idle header{opacity:0;visibility:hidden;pointer-events:none}
body:not(.overlay-idle) #now,body:not(.overlay-idle) header{opacity:1;visibility:visible;transition-delay:0s}
.overlay-hotspot{position:absolute;z-index:3;background:transparent;pointer-events:none}
#hotspot-top{top:0;left:0;right:0;height:64px}
#hotspot-bottom{bottom:0;left:0;right:0;height:85px}
body.overlay-idle .overlay-hotspot{pointer-events:auto}
#now small{font:800 10px system-ui;letter-spacing:.14em;color:#ecb759}
#now h1{margin:5px 0 2px;font-size:clamp(16px,2.5vw,30px);font-weight:900;text-shadow:0 2px 4px #000}
#now p{margin:0;font-size:12px;color:#f0d3a5}
#guide{position:absolute;z-index:4;left:10px;top:48px;width:min(430px,calc(100vw - 20px));max-height:min(76vh,590px);overflow:auto;background:#0b1828ed;border:1px solid #6fa9e1;border-radius:6px;box-shadow:0 12px 28px #000c}
#guide[hidden]{display:none}
#guide h2{position:sticky;top:0;margin:0;background:#152f50;padding:13px 15px;border-bottom:1px solid #ae723a;font-size:15px}
#guide ol{list-style:none;padding:0;margin:0}#guide li{display:flex;align-items:start;gap:12px;padding:11px;border-bottom:1px solid #6d3b2a}
#guide li.live{background:#244c78}#guide time{min-width:72px;color:#dbb95a;font-size:11px}
#guide b{font-size:12px}#guide li small{display:block;color:#aa8d7d;margin-top:2px}
#guide footer{font-size:11px;padding:11px;color:#c0a68a}
@media(max-width:550px){button{padding:7px 8px;font-size:11px}#now{padding:12px}#now h1{font-size:16px}}
@media(prefers-reduced-motion:reduce){#now,header{transition:none !important}}
/* Persistent edge control stays in the parent document, outside YouTube's iframe. */
#menu-reveal{position:absolute;z-index:5;top:8px;left:10px;display:none;opacity:.85;padding:6px 10px;min-height:30px;pointer-events:auto}
body.overlay-idle #menu-reveal{display:block}
body.overlay-idle #menu-reveal:hover,body.overlay-idle #menu-reveal:focus-visible{opacity:1}
/* Full-size YouTube player. Parent controls fade over the video without reserving a strip. */
body.youtube-mode #youtube-shell{inset:0}
body.youtube-mode header{background:transparent}
body.youtube-mode #now{display:block}
body.youtube-mode #guide{top:48px}
body.youtube-mode.overlay-idle #menu-reveal{display:block;opacity:.45}
body.youtube-mode.overlay-idle #menu-reveal:hover,body.youtube-mode.overlay-idle #menu-reveal:focus-visible{opacity:1}
</style>
</head>
<body>
<video id="video" playsinline autoplay muted preload="auto"></video>
<div id="youtube-shell" hidden><div id="youtube-frame"></div></div>
<div id="status" role="status"><strong><span class="accent">PURORESU</span> TELEVISION</strong><small id="status-text">Tuning the channel…</small></div>
<header><div class="controls"><button id="guide-toggle" type="button" aria-expanded="false">☰ TV Guide</button></div><div class="controls"><button id="audio" type="button">🔇 Unmute</button><button id="retune" type="button">↻ Retune</button></div></header>
<aside id="guide" hidden aria-label="Channel program guide"><h2 id="guide-title">PURORESU TV Guide</h2><ol id="guide-list"></ol><footer>Dailymotion, Internet Archive and official YouTube wrestling uploads. Times shown locally; provider ads and embedding restrictions may apply.</footer></aside>
<section id="now" aria-live="polite"><small id="channel-name">PURORESU · OFFICIAL YOUTUBE</small><h1 id="program-name">Tuning…</h1><p id="program-details">Independent Baked TV feed</p></section>
<button id="menu-reveal" type="button" aria-label="Show Baked TV controls">☰ Baked TV</button>
<div class="overlay-hotspot" id="hotspot-top" aria-hidden="true"></div>
<div class="overlay-hotspot" id="hotspot-bottom" aria-hidden="true"></div>
<script src="../feeds/player-core-mixed.js?mix=three-way-20261128"></script>
</body>
</html>
